<style>
  :root{
    --accent:#b68235; --a100:#f7e9d3; --a200:#ecd0a6; --a300:#e1ad66; --a400:#c68f3f;
    --n100:#f4f2f0; --n200:#ddd9d4; --n300:#c3beb7; --n400:#a29c94; --n500:#817b73; --n600:#635e58;
    --s2:9px; --s3:14px; --s4:18px; --s6:28px; --s8:46px;
    --rm:4px; --heading:'Cormorant Garamond',serif; --body:'Lora',serif;
    --hair:rgba(248,244,244,.12); --hair2:rgba(248,244,244,.2);
    --gold22:rgba(225,173,102,.22); --gold34:rgba(225,173,102,.34);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#1b1917}
  body{min-height:100vh;color:var(--n100);font-family:var(--body);
    background:radial-gradient(120% 90% at 50% 0%,#241f1a 0%,#1b1917 60%)}
  button{font:inherit}
  a{color:var(--a300);text-decoration:none;border-bottom:1px solid var(--gold34)}
  a:hover{color:var(--a200)}
  ::selection{background:rgba(225,173,102,.3)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
  @keyframes glow{0%,100%{box-shadow:0 0 0 rgba(225,173,102,0)}50%{box-shadow:0 0 18px rgba(225,173,102,.35)}}
  @keyframes leg{0%{transform:rotate(-11deg)}100%{transform:rotate(11deg)}}

  .wrap{min-height:100vh;display:flex;flex-direction:column;padding:var(--s6) var(--s8) var(--s4);position:relative;overflow:hidden}
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--s6);
    padding-bottom:var(--s3);border-bottom:1px solid var(--gold22)}
  .wordmark{font-family:var(--heading);font-weight:300;font-size:44px;line-height:1;letter-spacing:.18em;text-transform:uppercase;text-align:center}
  .tagline{font-family:var(--heading);font-style:italic;font-weight:300;font-size:17px;color:var(--a300);margin-top:6px;text-align:center}
  .ghostbtn{border:1px solid var(--hair2);background:transparent;color:var(--n300);border-radius:var(--rm);
    padding:10px 18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
  .ghostbtn:hover{border-color:var(--a400);color:var(--a300)}
  .seg{display:flex;border:1px solid var(--hair2);border-radius:var(--rm);overflow:hidden}
  .seg button{border:0;background:transparent;color:var(--n400);padding:10px 18px;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
  .seg button:hover{background:rgba(225,173,102,.26);color:var(--a100)}
  .seg button.on{background:rgba(225,173,102,.16);color:var(--a200)}

  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--s4) 0;gap:var(--s4)}
  .catrow{position:relative;display:flex;justify-content:center}
  #catBtn{display:flex;align-items:center;gap:12px;border:1px solid var(--a400);background:transparent;
    color:var(--a200);border-radius:999px;padding:10px 24px;font-size:13px;letter-spacing:.1em;cursor:pointer}
  #catBtn.locked{border-color:rgba(248,244,244,.1);color:var(--n600);cursor:not-allowed}
  #catMenu{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);z-index:5;min-width:270px;
    background:#221e1a;border:1px solid rgba(225,173,102,.28);border-radius:var(--rm);
    box-shadow:0 18px 40px rgba(0,0,0,.5);padding:var(--s2) 0}
  #catMenu button{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);width:100%;
    border:0;background:transparent;padding:11px 20px;font-family:var(--body);font-size:14px;text-align:left;cursor:pointer;color:var(--n200)}
  #catMenu button:hover{color:var(--a200)}
  #catMenu button.on{color:var(--a200)}
  .scrim{position:fixed;inset:0;z-index:4}

  .stage{width:100%;display:flex;align-items:center;justify-content:center;gap:var(--s6)}
  .mirror{flex:0 0 190px}
  .reelcol{flex:0 1 820px;min-width:0;position:relative}
  .frame{position:relative;border:1px solid var(--gold22);border-radius:var(--rm);
    background:linear-gradient(180deg,rgba(248,244,244,.04) 0%,transparent 40%)}
  .rule{position:absolute;left:-1px;right:-1px;height:1px;background:var(--gold34)}
  .brackets{position:absolute;left:-1px;right:-1px;top:150px;height:150px;pointer-events:none}
  .brackets i{position:absolute;width:10px;height:10px;border:0 solid var(--a400)}
  .win{position:relative;height:450px;overflow:hidden;
    mask-image:linear-gradient(to bottom,transparent 2%,rgba(0,0,0,.3) 20%,#000 34%,#000 66%,rgba(0,0,0,.3) 80%,transparent 98%);
    -webkit-mask-image:linear-gradient(to bottom,transparent 2%,rgba(0,0,0,.3) 20%,#000 34%,#000 66%,rgba(0,0,0,.3) 80%,transparent 98%)}
  #reel{will-change:transform}
  .row{height:150px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 var(--s6);
    font-family:var(--heading);font-weight:300;line-height:1.14;letter-spacing:-.004em;text-wrap:pretty}
  .cover{position:absolute;left:0;right:0;height:150px;background:#1b1917;display:none}
  .noghost .cover{display:block}
  .bar{height:2px;background:rgba(248,244,244,.1);position:relative;overflow:hidden}
  #barFill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--a400)}

  .controls{display:flex;align-items:center;justify-content:center;gap:var(--s3);margin-top:var(--s4);flex-wrap:wrap}
  .pill{border:1px solid var(--hair2);background:transparent;color:var(--n200);border-radius:999px;
    padding:13px 26px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
  .pill:hover{border-color:var(--a400);color:var(--a300)}
  .pill.gold{border-color:var(--a400);background:rgba(225,173,102,.12);color:var(--a200)}
  .pill.gold:hover{background:rgba(225,173,102,.22)}
  .pill.bright{border-color:var(--a200);background:rgba(225,173,102,.18);color:var(--a100)}
  #spinBtn{border:1px solid var(--a400);background:transparent;color:var(--a300);border-radius:999px;
    padding:15px 46px;font-family:var(--heading);font-weight:500;font-size:16px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer}
  #spinBtn:hover{background:rgba(225,173,102,.14);color:var(--a200)}
  #spinBtn[disabled]{border-color:rgba(225,173,102,.26);color:var(--n600);cursor:not-allowed;background:transparent}
  #researchBtn{border:1px solid var(--hair2);background:transparent;color:var(--n300);border-radius:999px;
    padding:15px 30px;font-size:14px;font-variant-numeric:tabular-nums;cursor:pointer}
  #researchBtn:hover{border-color:var(--a400);color:var(--a300)}
  #researchBtn[disabled]{border-color:rgba(248,244,244,.1);color:var(--n600);cursor:not-allowed}
  .clockwrap{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
  .kicker{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--a300)}
  #bigClock{font-family:var(--heading);font-weight:300;font-size:64px;line-height:1;letter-spacing:.04em;
    font-variant-numeric:tabular-nums;color:var(--a200)}
  #bigClock.paused{color:var(--n500);animation:breathe 1600ms ease-in-out infinite}
  .hidden{display:none !important}

  .cordcol{flex:0 0 190px;align-self:stretch;display:flex;flex-direction:column;align-items:center;
    user-select:none;touch-action:none;position:relative}
  .mount{width:74px;height:9px;border-radius:0 0 3px 3px;background:linear-gradient(180deg,#4a3c26,#2a241d);
    border:1px solid rgba(225,173,102,.3);border-top:0}
  .nipple{width:22px;height:7px;border-radius:0 0 999px 999px;background:linear-gradient(180deg,#e1ad66,#7d5411)}
  #sway{position:relative;width:0;transform-origin:50% 0;transform:rotate(0deg)}
  #cord{width:2px;height:150px;margin-left:-1px;background:linear-gradient(90deg,#6b5a3c,#d8c49a 45%,#6b5a3c);border-radius:2px}
  .grab{position:absolute;left:-18px;top:0;bottom:-36px;width:36px;cursor:grab;z-index:2}
  #brainWrap{width:60px;height:60px;margin-left:-30px;margin-top:-4px;display:flex;align-items:center;
    justify-content:center;transition:opacity 260ms ease;cursor:grab}
  #brainWrap.locked{cursor:not-allowed;opacity:.32}
  #brainWrap img{display:block;width:60px;height:60px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
  .legs{width:60px;margin-left:-30px;margin-top:-4px;display:flex;justify-content:center;gap:16px;pointer-events:none}
  .leg{width:7px;height:24px;border-radius:4px;background:linear-gradient(90deg,#d97a8c,#f2a3b0 50%,#d97a8c);
    transform-origin:50% 0;animation:leg 2.6s ease-in-out infinite alternate}
  .leg:last-child{animation-direction:alternate-reverse}
  .foot{width:16px;height:8px;margin:22px 0 0 -4px;border-radius:999px 999px 999px 4px;background:#f7dccd}

  footer{display:flex;justify-content:center;border-top:1px solid var(--hair);padding-top:var(--s2);min-height:10px}

  #scrimS{position:absolute;inset:0;background:rgba(10,9,8,.55);z-index:8}
  aside{position:absolute;top:0;right:0;bottom:0;width:360px;background:#1f1b18;border-left:1px solid var(--gold22);
    box-shadow:-24px 0 60px rgba(0,0,0,.5);padding:var(--s8) var(--s6);overflow:auto;z-index:9}
  .asideHead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--hair);padding-bottom:var(--s3)}
  .asideHead h2{font-family:var(--heading);font-size:26px;font-weight:300;margin:0;letter-spacing:.04em}
  .lbl{margin-top:var(--s6);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--n500)}
  .opts{display:flex;gap:var(--s2);margin-top:var(--s3);flex-wrap:wrap}
  .opt{border:1px solid rgba(248,244,244,.18);background:transparent;color:var(--n400);border-radius:999px;
    padding:8px 18px;font-size:12px;letter-spacing:.06em;font-family:var(--body);cursor:pointer;white-space:nowrap}
  .opt:hover{border-color:var(--a400);color:var(--a300)}
  .opt.on{border-color:var(--a400);background:rgba(225,173,102,.16);color:var(--a200)}
  .toggles{margin-top:var(--s6);border-top:1px solid var(--hair)}
  .toggle{width:100%;display:flex;align-items:baseline;justify-content:space-between;background:transparent;border:0;
    border-bottom:1px solid var(--hair);padding:var(--s4) 0;cursor:pointer;color:var(--n100);font-size:15px;text-align:left}
  .toggle:hover{color:var(--a300)}
  .toggle span:last-child{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--a300)}
  aside p{margin-top:var(--s6);font-size:13px;line-height:1.75;color:var(--n500);font-style:italic;text-align:justify}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><button class="ghostbtn" id="settingsBtn">Settings</button></div>
    <div>
      <div class="wordmark">braincell</div>
      <div class="tagline">research it, then say it out loud</div>
    </div>
    <div style="display:flex;justify-content:flex-end">
      <div class="seg" id="modeSeg">
        <button data-mode="questions" class="on">Questions</button>
        <button data-mode="concepts">Concepts</button>
        <button data-mode="definitions">Definitions</button>
      </div>
    </div>
  </header>

  <main>
    <div class="catrow">
      <button id="catBtn"><span id="catLabel">All three modules</span><span id="caret" style="font-size:9px;opacity:.8">▼</span></button>
    </div>

    <div class="stage">
      <div class="mirror" aria-hidden="true"></div>

      <div class="reelcol">
        <div class="frame" id="frame">
          <div class="rule" style="top:150px"></div>
          <div class="rule" style="top:300px"></div>
          <div class="brackets">
            <i style="left:0;top:-4px;border-left-width:1px;border-top-width:1px"></i>
            <i style="right:0;top:-4px;border-right-width:1px;border-top-width:1px"></i>
            <i style="left:0;bottom:-4px;border-left-width:1px;border-bottom-width:1px"></i>
            <i style="right:0;bottom:-4px;border-right-width:1px;border-bottom-width:1px"></i>
          </div>
          <div class="win">
            <div id="reel"></div>
            <div class="cover" style="top:0"></div>
            <div class="cover" style="bottom:0"></div>
          </div>
          <div class="bar"><div id="barFill"></div></div>
        </div>

        <div class="controls" id="runRow">
          <div class="clockwrap">
            <div class="kicker" id="kicker">Researching</div>

const SPEEDS = [["Quick", 0.65], ["Normal", 1], ["Long", 1.5]];
const ROW = 150, CORD = 150;

const $ = id => document.getElementById(id);
const el = {
  reel: $('reel'), frame: $('frame'), bar: $('barFill'), cord: $('cord'), sway: $('sway'),
  brain: $('brainWrap'), grab: $('grab'), catBtn: $('catBtn'), catLabel: $('catLabel'), caret: $('caret'),
  runRow: $('runRow'), idleRow: $('idleRow'), kicker: $('kicker'), clock: $('bigClock'),
  spin: $('spinBtn'), research: $('researchBtn'), pause: $('pauseBtn'), done: $('doneBtn'),
  restart: $('restartBtn'), speak: $('speakBtn'), reset: $('resetBtn'),

};

  mode: 'questions', cat: 'Random', spinning: false, landed: false, idx: 0,
  catOpen: false, sound: true, ghosts: true, autoStart: false,
  researchLen: 900, speakLen: 120, phase: 'idle', left: 0, paused: false, speed: 1, pool: []
};
let offset = 0, tid = null, raf = null, snapRaf = null, audioDead = false, ctx = null;

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const entries = (cat, mode) => {
  const d = DATA[cat]; if (!d) return [];
  if (mode === 'concepts') return d.concepts.map(c => c[0]);
  if (mode === 'definitions') return d.definitions || [];
  return d.research.concat(d.wider);
};
const buildPool = (mode, cat) => {
  const cats = cat === 'Random' ? Object.keys(DATA) : [cat];
  const list = cats.reduce((acc, k) => acc.concat(entries(k, mode)), []);
  if (!list.length) return ['No definitions for this module yet'];
  return shuffle(list.slice());
};
const clock = s => { const m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' + r : r); };

function ac() {
  try {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
    if (ctx.state === 'suspended') { const r = ctx.resume(); if (r && r.catch) r.catch(() => {}); }
    return ctx;
  } catch (e) { audioDead = true; return null; }
}
function blip(freq, dur, vol, type) {
  if (!S.sound || audioDead) return;
  let a = null; try { a = ac(); } catch (e) { return; }
  if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    o.connect(g); g.connect(a.destination);
    const t = a.currentTime;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) { audioDead = true; }
}
const ding = () => { blip(659.25, .5, .06, 'triangle'); setTimeout(() => blip(987.77, .7, .045, 'triangle'), 70); };
const chime = () => [523.25, 659.25, 783.99].forEach((f, i) => setTimeout(() => blip(f, .6, .05, 'triangle'), i * 130));
const thwack = d => { blip(90 + d * .6, .16, .1, 'sawtooth'); setTimeout(() => blip(1200, .06, .04), 40); };

const fontSize = t => t.length < 46 ? 40 : t.length < 80 ? 31 : t.length < 120 ? 25 : 21;
function renderReel() {
  const rows = S.pool.concat(S.pool, S.pool);
  el.reel.innerHTML = '';
  const frag = document.createDocumentFragment();
  rows.forEach(t => {
    const d = document.createElement('div');
    d.className = 'row';
    d.style.fontSize = fontSize(t) + 'px';
    d.textContent = t;
    frag.appendChild(d);
  });
  el.reel.appendChild(frag);
  paintReel(0);
}
const reelY = extra => ROW - offset - (S.pool.length * ROW) + (extra || 0);
const paintReel = extra => { el.reel.style.transform = 'translateY(' + reelY(extra) + 'px)'; };

function paintCord(d, a) {
  el.cord.style.height = Math.max(40, CORD + d) + 'px';
  const w = d > 0 ? Math.max(.9, 2 - d / 200) : 2;
  el.cord.style.width = w + 'px';
  el.cord.style.marginLeft = (-w / 2) + 'px';
  el.sway.style.transform = 'rotate(' + a + 'deg)';
  if (!S.spinning) paintReel(Math.max(-8, Math.min(22, d * .16)));
}

function repool(mode, cat) {
  S.mode = mode; S.cat = cat;
  S.pool = buildPool(mode, cat);
  offset = 0; S.landed = false; S.idx = 0; S.phase = 'idle'; S.left = 0;
  clearInterval(tid);
  renderReel(); render();
}

function render() {
  const research = S.phase === 'research', speak = S.phase === 'speak', finished = S.phase === 'finished';
  const locked = S.spinning || research || speak || finished;

  el.frame.parentElement.classList.toggle('noghost', !S.ghosts);
  el.runRow.classList.toggle('hidden', !(research || speak || finished));
  el.idleRow.classList.toggle('hidden', S.phase !== 'idle');
  el.pause.classList.toggle('hidden', !(research || speak));
  el.done.classList.toggle('hidden', !research);
  el.restart.classList.toggle('hidden', !speak);
  el.speak.classList.toggle('hidden', !finished);

  el.kicker.textContent = S.spinning ? 'Spinning'
    : (S.paused && (research || speak)) ? 'Paused'
    : research ? 'Researching' : speak ? 'Speak now' : finished ? 'Finished'
    : S.landed ? 'Your question' : 'Ready';
  el.clock.textContent = clock(S.left);
  el.clock.classList.toggle('paused', S.paused);
  el.pause.textContent = S.paused ? 'Resume' : 'Pause';
  el.speak.textContent = 'Speak now — ' + clock(S.speakLen);
  el.research.textContent = S.spinning ? 'Spinning…' : 'Start ' + Math.round(S.researchLen / 60) + ' min research';
  el.spin.disabled = locked;
  el.research.disabled = locked;

  el.bar.style.width = (research || speak) ? ((S.left / (research ? S.researchLen : S.speakLen)) * 100).toFixed(2) + '%' : '0%';
  el.bar.style.background = speak ? 'var(--a200)' : 'var(--a400)';

  el.brain.classList.toggle('locked', locked);
  el.catBtn.classList.toggle('locked', locked);
  el.catLabel.textContent = S.cat === 'Random' ? 'All three modules' : S.cat;
  el.caret.textContent = S.catOpen ? '▲' : '▼';
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === S.mode));

  const menu = $('catMenu'), scrim = $('catScrim');
  if (S.catOpen && !menu) {
    const sc = document.createElement('div'); sc.className = 'scrim'; sc.id = 'catScrim';
    sc.onclick = () => { S.catOpen = false; render(); };
    const m = document.createElement('div'); m.id = 'catMenu';
    CATS.forEach(c => {
      const b = document.createElement('button');
      b.className = S.cat === c ? 'on' : '';
      b.innerHTML = '<span>' + (c === 'Random' ? 'Random — all three' : c) + '</span><span style="color:var(--a300)">' + (S.cat === c ? '✓' : '') + '</span>';
      b.onclick = () => { if (S.spinning || S.phase !== 'idle') return; S.catOpen = false; repool(S.mode, c); };
      m.appendChild(b);
    });
    el.catBtn.parentElement.appendChild(sc);
    el.catBtn.parentElement.appendChild(m);
  } else if (!S.catOpen) { if (menu) menu.remove(); if (scrim) scrim.remove(); }

  $('poolNote').textContent = S.pool.length + ' entries in this selection.';
  renderOpts();
}

function renderOpts() {
  const mk = (host, items, isOn, onPick) => {
    host.innerHTML = '';
    items.forEach(it => {
      const b = document.createElement('button');
      b.className = 'opt' + (isOn(it) ? ' on' : '');
      b.textContent = it.label;
      b.onclick = () => onPick(it);
      host.appendChild(b);
    });
  };
  mk($('researchOpts'), RESEARCH.map(m => ({ label: m + ' min', v: m * 60 })), it => S.researchLen === it.v,
    it => { clearInterval(tid); S.researchLen = it.v; S.phase = 'idle'; S.left = 0; render(); });
  mk($('speakOpts'), SPEAK.map(n => ({ label: clock(n), v: n })), it => S.speakLen === it.v,
    it => { clearInterval(tid); S.speakLen = it.v; S.phase = 'idle'; S.left = 0; render(); });
  mk($('speedOpts'), SPEEDS.map(([label, v]) => ({ label, v })), it => S.speed === it.v,
    it => { S.speed = it.v; render(); });
  $('tSound').lastElementChild.textContent = S.sound ? 'On' : 'Off';
  $('tGhosts').lastElementChild.textContent = S.ghosts ? 'On' : 'Off';
  $('tAuto').lastElementChild.textContent = S.autoStart ? 'On' : 'Off';
}

function run(phase) {
  if (S.spinning) return;
  clearInterval(tid);
  S.phase = phase; S.left = phase === 'research' ? S.researchLen : S.speakLen; S.paused = false;
  render();
  tid = setInterval(() => {
    if (S.paused) return;
    S.left -= 1;
    if (S.left <= 0) {
      clearInterval(tid);
      S.left = 0;
      if (S.phase === 'research') { chime(); setTimeout(() => run('speak'), 400); }
      else { ding(); S.phase = 'idle'; }
    } else if (S.left <= 5) blip(520, .07, .04, 'triangle');
    render();
  }, 1000);
}

function spin() {
  const N = S.pool.length;
  if (S.spinning || N < 3 || S.phase !== 'idle') { paintReel(0); return; }
  const span = N * ROW, start = offset;
  const startIdx = Math.round(start / ROW) % N;
  let target = Math.floor(Math.random() * N);
  if (target === startIdx) target = (target + 1 + Math.floor(Math.random() * (N - 1))) % N;
  const delta = ((target - startIdx) + N) % N;
  const D = (3 + Math.floor(Math.random() * 3)) * span + delta * ROW;
  const dur = 4600 * (S.speed || 1) + Math.random() * 700;

  clearInterval(tid);
  S.spinning = true; S.landed = false; S.phase = 'idle'; S.left = 0;
  render();

  const t0 = performance.now();
  let lastRow = Math.floor(start / ROW), lastTick = 0;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 4);
    const cur = start + D * e;
    offset = ((cur % span) + span) % span;
    paintReel(0);
    const row = Math.floor(cur / ROW);
    if (row !== lastRow) { lastRow = row; if (now - lastTick > 45) { lastTick = now; blip(820 + Math.random() * 140, .035, .028); } }
    if (p < 1) raf = requestAnimationFrame(step);
    else {
      offset = target * ROW;
      paintReel(0);
      S.spinning = false; S.landed = true; S.idx = target;
      render(); ding();
      if (S.autoStart) setTimeout(() => run('research'), 700);
    }
  };
  raf = requestAnimationFrame(step);
}

function snapBack(d0, a0, fire) {
  let d = d0, v = -d0 * .16, a = a0, av = 0, started = false;
  const step = () => {
    v += -0.040 * d - 0.095 * v; d += v;
    av += -0.055 * a - 0.10 * av; a += av;
    paintCord(d, a);
    if (!started && fire && d <= 2) { started = true; spin(); }
    if (Math.abs(d) < .5 && Math.abs(v) < .5 && Math.abs(a) < .3) {
      paintCord(0, 0);
      if (fire && !started) { started = true; spin(); }
      if (!S.spinning) paintReel(0);
      return;
    }
    snapRaf = requestAnimationFrame(step);
  };
  snapRaf = requestAnimationFrame(step);
}

function onCordDown(e) {
  if (S.spinning || S.phase !== 'idle') { blip(120, .08, .05, 'square'); return; }
  e.preventDefault();
  cancelAnimationFrame(snapRaf);
  const y0 = e.clientY, x0 = e.clientX;
  let d = 0, a = 0, lastNotch = 0;
  const move = ev => {
    const rawY = ev.clientY - y0;
    d = rawY <= 0 ? rawY * .25 : 265 * (1 - Math.exp(-rawY / 240));
    a = -Math.max(-22, Math.min(22, (ev.clientX - x0) * .13));
    paintCord(d, a);
    const notch = Math.round(d / 14);
    if (notch !== lastNotch) { lastNotch = notch; blip(240 + d * 3.4, .025, .03, 'sawtooth'); }
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    const fire = d >= 42;
    try { if (fire) thwack(d); } catch (err) {}
    try { snapBack(d, a, fire); }
    catch (err) { paintCord(0, 0); paintReel(0); if (fire) spin(); }
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
}

el.grab.addEventListener('pointerdown', onCordDown);
el.brain.addEventListener('pointerdown', onCordDown);
el.spin.onclick = spin;
el.research.onclick = () => run('research');
el.pause.onclick = () => { blip(S.paused ? 700 : 400, .08, .04, 'triangle'); S.paused = !S.paused; render(); };
el.done.onclick = () => { clearInterval(tid); blip(660, .25, .05, 'triangle'); S.phase = 'finished'; S.left = 0; S.paused = false; render(); };
el.speak.onclick = () => run('speak');
el.restart.onclick = () => run('speak');
el.reset.onclick = () => { clearInterval(tid); S.phase = 'idle'; S.left = 0; S.paused = false; render(); };
el.catBtn.onclick = () => { if (S.spinning || S.phase !== 'idle') return; S.catOpen = !S.catOpen; render(); };
document.querySelectorAll('#modeSeg button').forEach(b => {
  b.onclick = () => { if (S.spinning || S.phase !== 'idle') return; repool(b.dataset.mode, S.cat); };
});
$('settingsBtn').onclick = () => { el.drawer.classList.remove('hidden'); el.scrimS.classList.remove('hidden'); renderOpts(); };
const closeDrawer = () => { el.drawer.classList.add('hidden'); el.scrimS.classList.add('hidden'); };
$('closeDrawer').onclick = closeDrawer;
el.scrimS.onclick = closeDrawer;
$('tSound').onclick = () => { S.sound = !S.sound; renderOpts(); };
$('tGhosts').onclick = () => { S.ghosts = !S.ghosts; render(); };
$('tAuto').onclick = () => { S.autoStart = !S.autoStart; renderOpts(); };

S.pool = buildPool('questions', 'Random');
renderReel();
render();
</script>
